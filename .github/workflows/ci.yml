# 持续集成：校验 WOFF2 与包结构（不发布）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools
        run: python -m pip install fonttools brotli

      - name: Validate WOFF2 files
        run: python verify-woff2.py

      - name: Check package layout
        run: |
          test -f packages/maple-mono-nf-cn-webfont/400.css
          test -f packages/maple-mono-nf-cn-webfont/files/maple-mono-nf-cn-400-normal.woff2
          test -f packages/slim-core/webfonts/MapleMono-NF-CN-Regular.woff2
          test -f packages/slim-standard/package.json
          echo "package layout OK"
