# 构建并发布 npm 包到组织 @nulijiazaizhong
# 触发：推送 v* tag，或手动 workflow_dispatch
# 仓库 Secret：NPM_TOKEN（Automation / Granular Access Token）
name: Build and Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools
        run: python -m pip install fonttools brotli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync version from tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./packages/maple-mono-nf-cn-webfont/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publish version: $VERSION"

      - name: Rebuild slim packages
        run: |
          python make-slim.py --preset core \
            --package-name "@nulijiazaizhong/maple-mono-nf-cn-woff2-slim" \
            --version "${{ steps.meta.outputs.version }}" \
            --out packages/slim-core
          python make-slim.py --preset standard \
            --package-name "@nulijiazaizhong/maple-mono-nf-cn-woff2" \
            --version "${{ steps.meta.outputs.version }}" \
            --out packages/slim-standard

      - name: Set package versions
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const pkgs = [
            'packages/maple-mono-nf-cn-webfont/package.json',
            'packages/slim-core/package.json',
            'packages/slim-standard/package.json',
          ];
          for (const p of pkgs) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = version;
            j.publishConfig = { access: 'public' };
            if (j.name && j.name.startsWith('@') && !j.name.startsWith('@nulijiazaizhong/')) {
              j.name = '@nulijiazaizhong/' + j.name.split('/').pop();
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log(p, '->', j.name, j.version);
          }
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            packages/maple-mono-nf-cn-webfont
            packages/slim-core
            packages/slim-standard
          retention-days: 7

  publish:
    name: Publish ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/maple-mono-nf-cn-webfont
          - packages/slim-core
          - packages/slim-standard
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: packages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@nulijiazaizhong"

      - name: Publish to npm
        working-directory: ${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
